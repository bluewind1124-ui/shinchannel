<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지사 소개 | 한국보험금융 신채널</title>
<meta name="description" content="한국보험금융 신채널 전국 지사 위치와 명단. 지사를 누르면 지사별 소개 페이지로 이동합니다.">
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#0F2340">
<meta property="og:type" content="website">
<meta property="og:site_name" content="한국보험금융 신채널">
<meta property="og:title" content="한국보험금융 신채널 | 지사 소개">
<meta property="og:description" content="전국 신채널 지사의 위치와 지사별 소개를 확인하세요.">
<meta property="og:image" content="https://bluewind1124-ui.github.io/shinchannel/img/og-image.jpg">
<meta property="og:url" content="https://bluewind1124-ui.github.io/shinchannel/branches.html">
<!-- 심의 전 초안: 검색엔진 노출 막음 (정식 공개 때 지우기) -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/branch.css">
</head>
<body>
<header>
  <div class="wrap hd">
    <a class="logo" href="index.html"><img src="img/logo-on-navy.png" alt="한국보험금융"><span>신채널</span></a>
    <nav><a href="index.html">홈</a><a class="on" href="branches.html">지사 소개</a><a href="index.html#apply">간편 문의</a></nav>
  </div>
</header>

<section class="top dark">
  <div class="wrap">
    <p class="eyebrow">지사 소개</p>
    <h1>가까운 곳에서 만나는<br><em>신채널 지사</em></h1>
    <p>지도에서 위치를 확인하고, 아래 명단에서 지사를 누르면 지사별 소개 페이지로 이동합니다.</p>
  </div>
</section>

<section class="map-sec">
  <div class="wrap">
    <div class="kmap-wrap" role="region" aria-label="신채널 지사 위치 지도">
      <div class="kmap-panel"><p class="kmap-cap">전국</p><div class="kmap" id="kAll"></div></div>
      <div class="kmap-panel metro"><p class="kmap-cap">수도권 확대 <small>지사 10곳</small></p><div class="kmap" id="kMetro"></div></div>
    </div>
  </div>
</section>

<section class="list-sec">
  <div class="wrap">
    <div class="list-head">
      <h2>지사 명단</h2>
      <p class="cnt">등록된 지사 <b id="cnt">0</b>곳</p>
    </div>
    <table class="blist">
      <thead><tr><th style="width:24%">지사명</th><th>주소</th><th style="width:13%">지사장</th><th style="width:16%">연락처</th><th style="width:11%"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="list-foot">* 2026년 10월 기준. 지사를 누르면 지사 소개 페이지로 이동합니다.</p>
  </div>
</section>

<footer>
  <div class="wrap"><b>한국보험금융(주)</b> · 서울 용산구 한강대로 257, 14층(갈월동, 청룡빌딩) · TEL 02-771-5050</div>
</footer>

<script src="js/korea-map.js"></script>
<script src="js/branches.js"></script>
<script>
(function(){
  var B = (window.BRANCHES || []).slice().sort(function(a,b){return (a.no||99)-(b.no||99)});
  var esc = function(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var tbd = '<span class="tbd">확인 중</span>';
  var link = function(b){return 'branch.html?id='+encodeURIComponent(b.id)};

  /* 명단 */
  document.getElementById('cnt').textContent = B.length;
  var rows = document.getElementById('rows');
  B.forEach(function(b){
    var tr = document.createElement('tr');
    tr.dataset.id = b.id;
    tr.innerHTML =
      '<td><div class="nm">'+esc(b.name)+(b.en?'<small>'+esc(b.en)+'</small>':'')+'</div></td>'+
      '<td data-k="주소">'+(b.addr?esc(b.addr):tbd)+'</td>'+
      '<td data-k="지사장">'+(b.ceo?esc(b.ceo):tbd)+'</td>'+
      '<td data-k="전화">'+(b.tel?'<a href="tel:'+esc(b.tel.replace(/[^0-9]/g,''))+'" onclick="event.stopPropagation()">'+esc(b.tel)+'</a>':tbd)+'</td>'+
      '<td><a class="go" href="'+link(b)+'">소개 보기 →</a></td>';
    tr.onclick = function(){location.href = link(b)};
    rows.appendChild(tr);
  });

  /* 지도: 외부 지도 서버 없이 시도 경계를 SVG로 그림 + 지사 위치 표시 */
  var M = window.KOREA_MAP, XY = window.KOREA_XY;
  var METRO = {lng0:126.70, lng1:127.22, lat0:37.43, lat1:37.80};
  /* 수도권 확대 지도에서 이름표가 겹치지 않게 놓을 방향 */
  var LBL = {acemullae:'l', epercul:'bl', jamsil:'t', songpa:'b', heritage:'r', thedream:'t', therich:'l', bucheon:'b', ilsan:'r', uijeongbu:'r'};
  var inMetro = function(b){return b.lng>=METRO.lng0&&b.lng<=METRO.lng1&&b.lat>=METRO.lat0&&b.lat<=METRO.lat1};
  var short = function(n){return n.replace(/ ?금융지사$|지사$/,'')};
  function draw(box, vb, opt){
    if(!M||!box) return;
    var svg = '<svg viewBox="'+vb.join(' ')+'" preserveAspectRatio="xMidYMid meet" aria-hidden="true">';
    M.paths.forEach(function(p,i){svg += '<path class="pv'+(p.c==='11'?' seoul':'')+'" style="animation-delay:'+(i*0.03)+'s" d="'+p.d+'"/>'});
    if(opt.labels) M.labels.forEach(function(l){svg += '<text class="pl'+(l.big?' big':'')+'" x="'+l.x+'" y="'+l.y+'">'+l.t+'</text>'});
    if(opt.metroBox){var a=XY(METRO.lat1,METRO.lng0),c=XY(METRO.lat0,METRO.lng1);svg += '<rect class="mbox" x="'+a[0]+'" y="'+a[1]+'" width="'+(c[0]-a[0])+'" height="'+(c[1]-a[1])+'"/>';}
    if(opt.seoulLabel){var sx=XY(37.545,126.99);svg += '<text class="pl seoul-l" x="'+sx[0]+'" y="'+sx[1]+'">서울</text>';}
    svg += '</svg>';
    box.innerHTML = svg;
    box.style.aspectRatio = vb[2]+' / '+vb[3];
    B.forEach(function(b,i){
      if(b.lat==null||b.lng==null) return;
      var m = inMetro(b); if(opt.only==='metro'&&!m) return;
      var q = XY(b.lat,b.lng), x=(q[0]-vb[0])/vb[2]*100, y=(q[1]-vb[1])/vb[3]*100;
      var a = document.createElement('a');
      a.className = 'kpin'+(opt.only==='metro'||!m?' lab':'')+' d-'+(opt.only==='metro'?(LBL[b.id]||'r'):'r');
      a.href = link(b); a.dataset.id = b.id; a.title = b.name+(b.addr?' · '+b.addr:'');
      a.style.left = x+'%'; a.style.top = y+'%'; a.style.animationDelay = (0.4+i*0.08)+'s';
      a.innerHTML = '<i></i><span>'+esc(short(b.name))+'</span>';
      a.addEventListener('mouseenter',function(){hl(b.id,true)}); a.addEventListener('mouseleave',function(){hl(b.id,false)});
      box.appendChild(a);
    });
  }
  var a0 = XY(METRO.lat1,METRO.lng0), a1 = XY(METRO.lat0,METRO.lng1);
  draw(document.getElementById('kAll'), [-10,-10,(M?M.w:1000)+20,(M?M.h:950)+20], {labels:true, metroBox:true});
  draw(document.getElementById('kMetro'), [a0[0],a0[1],a1[0]-a0[0],a1[1]-a0[1]], {only:'metro', seoulLabel:true});
  function hl(id,on){
    var tr = rows.querySelector('tr[data-id="'+id+'"]'); if(tr) tr.classList.toggle('hl',on);
    document.querySelectorAll('.kpin[data-id="'+id+'"]').forEach(function(p){p.classList.toggle('hl',on)});
  }
  rows.querySelectorAll('tr').forEach(function(tr){
    tr.addEventListener('mouseenter',function(){hl(tr.dataset.id,true)});
    tr.addEventListener('mouseleave',function(){hl(tr.dataset.id,false)});
  });
})();
</script>
</body>
</html>
